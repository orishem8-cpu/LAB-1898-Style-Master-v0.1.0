name: Windows VST3 build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          git --version
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_QUIET=OFF

      - name: List generated build targets
        run: cmake --build build --config Release --target help

      # Build the deliverable VST3 first so it can be uploaded even if the
      # optional Standalone target fails afterwards.
      - name: Build VST3
        run: cmake --build build --config Release --target LAB1898StyleMaster_VST3 --parallel 2

      - name: Locate and package VST3 bundle
        id: locate-vst3
        shell: pwsh
        run: |
          $matches = Get-ChildItem -Path "build" -Directory -Filter "*.vst3" -Recurse -ErrorAction SilentlyContinue
          $plugin = $matches | Where-Object { $_.Name -eq "LAB 1898 Style Master.vst3" } | Select-Object -First 1

          if ($null -eq $plugin) {
            Write-Host "No VST3 bundle with the expected product name was found. Build tree follows:"
            Get-ChildItem -Path "build" -Force -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName |
              Select-Object -First 300 |
              ForEach-Object { Write-Host $_ }
            throw "VST3 bundle not found. Check the Build VST3 step and the JUCE target output."
          }

          $archive = Join-Path $env:GITHUB_WORKSPACE "LAB1898-Style-Master-Windows-x64-VST3.zip"
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Compress-Archive -Path $plugin.FullName -DestinationPath $archive -CompressionLevel Optimal

          "bundle=$($plugin.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Found VST3 bundle: $($plugin.FullName)"
          Write-Host "Packaged archive: $archive"

      - name: Upload VST3 bundle and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LAB-1898-Style-Master-Windows-x64
          path: |
            ${{ steps.locate-vst3.outputs.bundle }}
            ${{ steps.locate-vst3.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Build Standalone
        run: cmake --build build --config Release --target LAB1898StyleMaster_Standalone --parallel 2
